name: comptaclub

services:
  coreapi:
    build:
      context: ../..
      dockerfile: src/ComptaClub.Blazor/Dockerfile
      args:
        AZURE_DEVOPS_PAT: ${AZURE_DEVOPS_PAT}
    image: comptaclub:dev
    container_name: comptaclub
    restart: no
    environment:
      - ASPNETCORE_ENVIRONMENT=development
      - ASPNETCORE_URLS=http://+:8080
      - ComptaClub__TempFolder=/app/data/temp
      - ComptaClub__SqliteConnectionString=${COMPTACLUB_SQLITE_CONNECTION_STRING:-Data Source=/app/data/comptaclub.db}
    ports:
      - "34503:8080"
    volumes:
      - ./appsettings.local.json:/app/appsettings.local.json:ro
      - comptaclub-dev-data:/app/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

networks:
  actuasso-network:
    driver: bridge

volumes:
  comptaclub-dev-data:
