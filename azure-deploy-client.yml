trigger: 
- none

pool:
  vmImage: 'ubuntu-latest'

# pool:
#   name: 'Aspicot'

variables:
  solution: 'ComptaClub.sln'
  buildPlatform: 'Any CPU'
  buildConfiguration: 'Debug'
  dotnetVersion: 'net10.0'
      
steps:
- task: UseDotNet@2
  displayName: 'Install .NET 10 SDK'
  inputs:
    packageType: 'sdk'
    version: '10.0.x'

- task: NuGetAuthenticate@1
  displayName: 'Authenticate to Azure Artifacts'

- task: DotNetCoreCLI@2
  displayName: 'dotnet restore'
  inputs:
    projects: '$(solution)'
    command: 'restore'
    includeNuGetOrg: true   

- task: DotNetCoreCLI@2
  displayName: 'Build DeployToClustiis'
  inputs:
    command: 'build' 
    projects: '**/DeployToClustiis.csproj'
    arguments: '--configuration $(buildConfiguration)'

- task: Bash@3
  displayName: Deploy To ClustIIS
  condition: succeeded()
  inputs:    
    workingDirectory : '$(System.DefaultWorkingDirectory)'
    targetType: 'inline'
    script: |
        cd $(System.DefaultWorkingDirectory)/src/Tools/DeployToClustiis/bin/$(buildConfiguration)/$(dotnetVersion)/
        dotnet DeployToClustiis.dll --env production --wd $(System.DefaultWorkingDirectory)